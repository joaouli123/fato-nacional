packages:
  - "apps/*"
  - "packages/*"

overrides:
  electron-to-chromium: 1.5.378
  es-to-primitive: 1.3.0
  immutable: 4.3.8

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
